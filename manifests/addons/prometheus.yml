instance_groups:
- name: haproxy
  jobs:
  - name: haproxy
    properties:
      ha_proxy:
        tcp:
        - name: metrics_http
          port: (( grab meta.metrics.prometheus.port ))
          backend_port: (( grab meta.metrics.prometheus.port ))
          backend_servers: (( grab instance_groups.web.networks.0.static_ips ))
