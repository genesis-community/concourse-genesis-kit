---
# Authorize by GitHub organization: every member of each listed org can
# log in.
#
# Included only when the environment sets params.github_allowed_orgs; see
# _handle_oauth_features in hooks/blueprint.pm.  The value is a list of
# organization names, which is what the concourse release's
# main_team.auth.github.orgs property expects.
meta:
  jobs:
    web:
      properties:
        main_team:
          auth:
            github:
              orgs: (( grab params.github_allowed_orgs ))
