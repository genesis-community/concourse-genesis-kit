  tsa_port: "2222"
  tsa_host_public_key: ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQDtsa-host-public-key
  tsa_worker_private_key: not-a-real-private-key
  tsa_worker_public_key: ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQDtsa-worker-public-key
