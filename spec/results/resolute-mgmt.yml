exodus:
  bosh: resolute-mgmt
  external_url: https://concourse.testing.examle
  features: ocfp,aws,no-tls,resolute
  iaas: aws
  is_director: false
  main_target: resolute-mgmt
  mode: full
  password: <!{meta.vault}/webui:password!>
  scale: null
  services: null
  tsa_host: concourse.testing.examle
  tsa_host_public_key: <!{meta.vault}/tsa/host_key:public!>
  tsa_port: 2222
  tsa_worker_private_key: <!{meta.vault}/tsa/worker_key:private!>
  tsa_worker_public_key: <!{meta.vault}/tsa/worker_key:public!>
  use_create_env: false
  username: concourse
instance_groups:
- azs:
  - resolute-mgmt-z2
  - resolute-mgmt-z3
  instances: 3
  jobs:
  - name: worker
    properties:
      baggageclaim:
        driver: detect
      http_proxy_url: ""
      https_proxy_url: ""
      no_proxy:
      - localhost
      - 127.0.0.1
      runtime: containerd
      worker_gateway:
        worker_key:
          private_key: <!{meta.vault}/tsa/worker_key:private!>
          public_key: <!{meta.vault}/tsa/worker_key:public!>
    release: concourse
  name: worker
  networks:
  - name: resolute-mgmt.concourse.net-concourse
  stemcell: default
  update:
    max_in_flight: 3
    serial: true
  vm_type: resolute-mgmt.concourse.vm-concourse-worker
- azs:
  - resolute-mgmt-z1
  instances: 1
  jobs:
  - name: web
    properties:
      add_local_users:
      - concourse:<!{meta.vault}/webui:password-bcrypt!>
      bind_port: 80
      external_url: https://concourse.testing.examle
      main_team:
        auth:
          local:
            users:
            - concourse
      postgresql:
        ca_cert:
          certificate: test-db-ca
        database: concourse
        host: db.testing.example
        port: "5432"
        role:
          name: concourse
          password: test-db-password
        sslmode: verify-ca
      publicly_viewable: true
      token_signing_key:
        private_key: <!{meta.vault}/atc/token_signing_key:private!>
        public_key: <!{meta.vault}/atc/token_signing_key:public!>
      vault:
        auth:
          backend: approle
          backend_max_ttl: null
          client_token: null
          params:
            role_id: test-role-id
            secret_id: test-role-secret
        path_prefix: /secret/concourse
        shared_path: shared
        tls:
          insecure_skip_verify: false
        url: https://vault.testing.example
      worker_gateway:
        authorized_keys:
        - <!{meta.vault}/tsa/worker_key:public!>
        host_key:
          private_key: <!{meta.vault}/tsa/host_key:private!>
          public_key: <!{meta.vault}/tsa/host_key:public!>
    release: concourse
  - name: bpm
    release: bpm
  - name: locker
    properties:
      locker:
        password: <!{meta.vault}/locker/api:password!>
        ssl_cert: <!{meta.vault}/locker/server:certificate!>
        ssl_key: <!{meta.vault}/locker/server:key!>
        user: locker
    release: locker
  name: web
  networks:
  - name: resolute-mgmt.concourse.net-concourse-web
  stemcell: default
  vm_extensions:
  - concourse-lb
  - concourse-lb
  vm_type: resolute-mgmt.concourse.vm-concourse
name: resolute-mgmt-concourse
releases:
- name: concourse
  sha1: dbc32d7c40ad1e6648d8dd749b8b50251bfd6b94
  url: https://bosh.io/d/github.com/concourse/concourse-bosh-release?v=8.2.2
  version: 8.2.2
- name: slack-notification-resource
  sha1: a64c65d1f23ea089746e698f29dbe522dd716c1b
  url: https://bosh.io/d/github.com/cloudfoundry-community/slack-notification-resource-boshrelease?v=9
  version: 9
- name: locker
  sha1: sha256:00
  url: https://example.com/locker-0.2.2.tgz
  version: 0.2.2
- name: bpm
  sha1: sha256:7b445508d63d2171d892ba33f836087e1e519b9782f44c5fa5290323616ca8e6
  url: https://bosh.io/d/github.com/cloudfoundry/bpm-release?v=1.4.41
  version: 1.4.41
stemcells:
- alias: default
  os: ubuntu-resolute
  version: "0.184"
update:
  canaries: 1
  canary_watch_time: 1000-60000
  max_in_flight: 4
  serial: false
  update_watch_time: 1000-60000
