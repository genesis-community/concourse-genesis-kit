---
# GitHub OAuth authorized by team rather than by organization: only members
# of the named teams may log in. github_allowed_orgs is deliberately unset,
# so main_team.auth.github must carry teams and no orgs at all -- an orgs
# entry here would admit every member of the organization.
kit:
  name:    dev
  version: latest
  features:
    - full
    - no-tls
    - github-oauth

genesis:
  env:         full-github-teams

params:
  external_domain: concourse.testing.examle

  github_allowed_teams:
    - test-org:test-team
    - test-org:other-team
