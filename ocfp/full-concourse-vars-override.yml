---
meta:
  ocfp:
    env:
      cloud: (( concat genesis.env "." genesis.type "." ))

params:
  external_domain: (( vault meta.ocfp.vault.config "/lbs/concourse:domain" ))

  num_web_nodes: 1
  worker: 3

  concourse_network:     (( concat meta.ocfp.env.cloud "net-concourse" ))
  concourse_network_web: (( concat meta.ocfp.env.cloud "net-concourse-web" ))
  concourse_disk_type:   (( concat meta.ocfp.env.cloud "disk-concourse" ))
  concourse_vm_type:     (( concat meta.ocfp.env.cloud "vm-concourse" ))
  worker_vm_type:        (( concat meta.ocfp.env.cloud "vm-concourse-worker" ))
  static_ips:             (( vault meta.ocfp.vault.config "/net/subnets/ocfp-0/reserved-ips:concourse-web_ip"))

  availability_zones:
    - (( concat genesis.env "-z1" ))
    - (( concat genesis.env "-z2" ))
    - (( concat genesis.env "-z3" ))

exodus:
  tsa_host: (( grab params.external_domain ))

---
- type: replace
  path: /instance_groups/name=web/vm_extensions?/-
  value: concourse-lb

- type: remove
  path: /instance_groups/name=web/networks/0/static_ips

- type: replace
  path: /instance_groups/name=worker/networks/0/name
  value: (( grab params.concourse_network ))

- type: replace
  path: /instance_groups/name=web/networks/0/name
  value: (( grab params.concourse_network_web ))

- type: replace
  path: /instance_groups/name=web/azs
  value: 
    - (( concat genesis.env "-z1" ))

- type: replace
  path: /instance_groups/name=worker/azs
  value: 
    - (( concat genesis.env "-z2" ))
    - (( concat genesis.env "-z3" ))

