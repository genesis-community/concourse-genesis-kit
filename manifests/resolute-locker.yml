---
# locker release for ubuntu-resolute.
#
# locker-boshrelease 0.2.1 calls chpst, which resolute does not ship, so the
# locker job cannot start.  Release 0.2.2 and later fix that, and spruce merges this
# entry over the pin in releases/locker.yml by name.

releases:
- name:    locker
  version: 0.2.3
  url:     https://github.com/cloudfoundry-community/locker-boshrelease/releases/download/v0.2.3/locker-0.2.3.tgz
  sha1:    4836455ed37c9df322325fd117cc9f940ac9870c
