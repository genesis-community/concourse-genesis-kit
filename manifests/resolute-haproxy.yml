---
# haproxy release for ubuntu-resolute.
#
# Releases before 16.13.0 bundle a socat that fails to compile on resolute.
# Spruce merges this entry over the pin in releases/haproxy.yml by name.  The
# kit only sets ha_proxy.tcp, which 16.13.0 still accepts unchanged.

releases:
- name:    haproxy
  version: 16.13.0+3.2.25
  url:     https://bosh.io/d/github.com/cloudfoundry-incubator/haproxy-boshrelease?v=16.13.0%2B3.2.25
  sha1:    sha256:0c0b25fbd6e37bff79aeca0405ab8ea2f0f5aea3b42326d16824957e0a8b9fc9
